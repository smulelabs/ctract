[project]
name = "ctract-chimera"
version = "0.0.1"
description = "Differentiable CHIMERA geometry, pressure-coupled sources, airway and convolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "numpy"]
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctract_chimera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["cuda: optional GPU checks (set CTRACT_TEST_CUDA=1)"]
